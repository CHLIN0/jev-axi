name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
      # Fail in seconds, not after the full build, when a release tag and the package version disagree.
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          src="v$(sed -nE 's/.*VERSION = "([^"]+)".*/\1/p' src/version.ts)"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ] || [ "$src" != "$tag" ]; then
            echo "::error::release tag $tag does not match package.json $pkg / src/version.ts $src. Bump both, commit, then re-point the release."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # no registry-url: setup-node would write a placeholder _authToken to .npmrc,
          # and npm must see no token at all to use the OIDC trusted-publisher flow
      # npm >= 11.5 authenticates to npmjs.com through GitHub's OIDC token when the
      # package has this workflow registered as a trusted publisher; no secret needed.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --access public --provenance
  action-tag:
    # Point the major tag (e.g. v0) at this release so `uses: shiftynick/jev-axi@v0` gets it.
    needs: npm
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${{ github.event.release.tag_name }}"
          major="${tag%%.*}"
          git tag -f "$major" "$tag"
          git push -f origin "refs/tags/$major"
