# Dogfooding: review this repository's pull requests with the action at this commit.
# Other repositories should use `uses: shiftynick/jev-axi@v0` as shown in the README.
name: jev-axi review
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: ./
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
        env:
          # Run the jev-axi built from this commit instead of the published version.
          JEV_AXI_BIN: '["node", "dist/bin/jev-axi.js"]'
